<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6e9f3">
<meta name="description" content="Love in Pixels - a pastel pixel-art puzzle adventure">
<title>Love in Pixels</title>
<style>
:root{
  --bg:#f6e9f3;--panel:#fff6e6;--ink:#3b2457;--soft:#7a5f99;--pink:#f4a3c4;--lav:#cbb5f0;--mint:#bfe8d2;--sky:#bfe0f5;--gold:#f2b632;--deep:#3b2457;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1d1330;--panel:#2c1f45;--ink:#f8ecff;--soft:#c3aee6;--pink:#d4709f;--lav:#6a52a3;--mint:#3d7a62;--sky:#3f6f93;--gold:#f2b632}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1d1330;--panel:#2c1f45;--ink:#f8ecff;--soft:#c3aee6;--pink:#d4709f;--lav:#6a52a3;--mint:#3d7a62;--sky:#3f6f93;--gold:#f2b632}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Courier New",ui-monospace,monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 14px 40px;line-height:1.5}
main{width:100%;max-width:880px}
h1{font-size:clamp(26px,6vw,40px);margin:8px 0 4px;text-align:center;text-shadow:3px 3px 0 var(--pink)}
.sub{color:var(--soft);margin:0 0 20px;text-align:center}
.bar{display:flex;flex-direction:column;align-items:center}
.go{font:inherit;font-weight:bold;font-size:18px;margin-top:20px;padding:12px 26px;background:var(--pink);color:#3b2457;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);cursor:pointer}
.go:hover{transform:translate(-1px,-1px)}
.go:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.hint{color:var(--soft);font-size:13px;margin-top:10px}
.scn{display:none}
.scn.show{display:block}
.sname{font-size:22px;color:var(--gold);text-shadow:2px 2px 0 var(--ink)}
.lbl{font-size:13px;color:#fff;text-shadow:1px 1px 0 var(--ink);font-weight:bold}
/* Character select */
.roster{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media(max-width:620px){.roster{grid-template-columns:repeat(3,1fr)}}
.card{font:inherit;color:inherit;background:var(--panel);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:10px 4px 8px;cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.card canvas{width:64px;height:96px;image-rendering:pixelated}
.card:hover{transform:translate(-1px,-1px)}
.card:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.card[aria-pressed="true"]{background:var(--lav);box-shadow:4px 4px 0 var(--gold);border-color:var(--gold)}
.card b{font-size:14px}
.card span{font-size:12px;color:var(--soft)}
.card[aria-pressed="true"] span{color:var(--ink)}
.detail{margin-top:22px;background:var(--panel);border:3px solid var(--ink);box-shadow:6px 6px 0 var(--pink);padding:18px;display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center}
@media(max-width:520px){.detail{grid-template-columns:1fr;justify-items:center;text-align:center}}
.stage{width:150px;height:200px;background:linear-gradient(var(--sky) 0 70%,var(--mint) 70%);border:3px solid var(--ink);display:flex;align-items:flex-end;justify-content:center}
.stage canvas{width:112px;height:168px;image-rendering:pixelated;margin-bottom:6px}
.detail h2{margin:0 0 2px;font-size:24px}
.detail p{margin:0 0 8px;max-width:52ch}
.perk{display:inline-block;background:var(--gold);color:#3b2457;border:2px solid var(--ink);padding:2px 8px;font-size:13px;font-weight:bold}
.go{font:inherit;font-weight:bold;font-size:18px;margin-top:20px;padding:12px 26px;background:var(--pink);color:#3b2457;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);cursor:pointer}
.go:hover{transform:translate(-1px,-1px)}
.go:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
@media(max-width:620px){.roster{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<h1>Love in Pixels</h1>
<p class="sub" id="sub">Who will explore The Little Somewhere?</p>
<main id="pick">
  <div class="roster" id="roster" role="group" aria-label="Characters"></div>
  <section class="detail" aria-live="polite">
    <div class="stage"><canvas id="big" width="16" height="24"></canvas></div>
    <div>
      <h2 id="dName"></h2>
      <p class="role" id="dRole"></p>
      <p id="dBlurb"></p>
      <span class="perk" id="dPerk"></span>
    </div>
  </section>
  <div class="bar">
    <button class="go" id="go">Start adventure</button>
    <div class="hint">Tap a character, then tap Start adventure</div>
  </div>
</main>
<main id="modes">
  <h2 class="mh">Choose your story</h2>
  <div class="mrow" id="mRow" role="group" aria-label="Story modes"></div>
  <div class="bar">
    <button class="go" id="modeGo">Begin story</button>
    <button class="alt" id="modeBack">Back to characters</button>
  </div>
</main>
<main id="welcome">
  <div class="stage"><canvas id="wc" width="16" height="24"></canvas></div>
  <h2 id="wName"></h2>
  <p id="wMsg"></p>
  <div class="bar">
    <button class="go" id="welcomeGo">Begin</button>
    <button class="alt" id="welcomeBack">Back to characters</button>
  </div>
</main>
<div id="game">
  <canvas id="gc" width="960" height="576"></canvas>
  <div id="hud"><span id="hs"></span><span id="ho"></span><button id="gx">Menu</button></div>
  <div id="dlg"></div>
  <div id="dpad">
    <button class="dp" data-k="u" style="grid-area:1/2" aria-label="Up">▲</button>
    <button class="dp" data-k="l" style="grid-area:2/1" aria-label="Left">◀</button>
    <button class="dp" data-k="r" style="grid-area:2/3" aria-label="Right">▶</button>
    <button class="dp" data-k="d" style="grid-area:3/2" aria-label="Down">▼</button>
  </div>
  <button id="act" class="dp" aria-label="Jump/Interact">Interact</button>
  <div id="rot"><div>↻</div><p>Turn your device sideways to play in landscape.</p></div>
</div>
<div id="letter" class="scn">
  <div class="stage"><canvas id="lc" width="16" height="24"></canvas></div>
  <h2 class="sname">A Letter to You</h2>
  <div id="lBody" style="font-size:15px;line-height:1.7"></div>
  <div class="tok" id="lClose">Close →</div>
</div>
<div id="album" class="scn">
  <div class="stage"><canvas id="ac" width="16" height="24"></canvas></div>
  <h2 class="sname">The Memory Album</h2>
  <div id="lItems" style="margin:12px 0"></div>
  <div class="tok" id="aClose">Close →</div>
</div>
<div id="video" class="scn">
  <div class="stage"><canvas id="vc" width="16" height="24"></canvas></div>
  <h2 class="sname">A Personal Message</h2>
  <div id="vItem" style="margin:12px 0;font-size:15px"></div>
  <video id="vAu" controls playsinline style="width:100%;max-width:640px"></video>
  <div class="tok" id="vClose">Close →</div>
</div>
<div id="music" class="scn">
  <div class="stage"><canvas id="muc" width="16" height="24"></canvas></div>
  <h2 class="sname">A Music Reward</h2>
  <div id="mItem" style="margin:12px 0;font-size:15px"></div>
  <audio id="mAu" controls></audio>
  <div style="display:flex;gap:8px;justify-content:center;margin:12px 0">
    <button class="go" id="mPlay" style="padding:6px 14px;font-size:14px">▶</button>
    <button class="alt" id="mClose2" style="padding:6px 14px;font-size:14px">Close</button>
  </div>
</div>

</body>
</html>
